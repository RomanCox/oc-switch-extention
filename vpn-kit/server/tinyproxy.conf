# tinyproxy для ocswitch
# HTTP-прокси, доступный ТОЛЬКО изнутри сервера.
# Снаружи не виден: попасть в него можно лишь через SSH-туннель,
# то есть пройдя аутентификацию по ключу.

User tinyproxy
Group tinyproxy

Port 8888

# САМАЯ ВАЖНАЯ СТРОКА.
# Без неё tinyproxy повесится на все интерфейсы и станет
# открытым прокси, который найдут сканерами за сутки.
Listen 127.0.0.1

Timeout 600
MaxClients 100

LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"

# Кто может пользоваться. Только локальные подключения,
# то есть только вышедшие из SSH-туннеля.
Allow 127.0.0.1

# Не сообщать сайтам, что запрос прошёл через прокси
DisableViaHeader Yes

# ConnectPort намеренно не задан: без него CONNECT разрешён
# на любой порт. Прокси доступен только вам, ограничивать нечего.
# Если захотите сузить до HTTPS — раскомментируйте:
# ConnectPort 443
# ConnectPort 563
